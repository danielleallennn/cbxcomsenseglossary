oles": ["Detailing"]}, {"id": "t27", "term": "Detailed Project", "def": "Project record created in Comsense after an estimate is sold, allowing project information to move into the Detailing workflow.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles": ["Detailing"]}, {"id": "t26", "term": "Detailer", "def": "A person who may perform Detailing workflow tasks by interpreting project documents and translating design intent into detailed door, frame, hardware, and submittal information.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles": ["Detailing"]}, {"id": "t25", "term": "Detailing", "def": "The Comsense workflow used to review, verify, coordinate, correct, and finalize sold-project information required for accurate downstream execution.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles": ["Detailing"]}, {"id": "t40", "term": "DHI Order", "def": "Standard Door and Hardware Institute sequence used to organize hardware items within a hardware set.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles": ["Detailing"]}, {"id": "t6", "term": "Door Screen", "def": "Comsense screen used to review, enter, and validate door information for project openings.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles": ["General Comsense User"]}, {"id": "t48", "term": "DPS (Door Position Switch)", "def": "Device used to monitor whether a door is open or closed.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles": ["Detailing"]}, {"id": "t36", "term": "Early Release", "def": "Material that must be ordered before the project's normal release point because of schedule, lead-time, or other project requirements.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles": ["Detailing", "Project Management"]}, {"id": "t56", "term": "Elevation", "def": "Drawing or graphical representation showing the configuration and dimensions of a door or frame.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles": ["Detailing"]}, {"id": "t57", "term": "Elevation Code", "def": "Identifier assigned to an elevation type so it can be associated with applicable openings.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles": ["Detailing"]}, {"id": "t49", "term": "EPT (Electric Power Transfer)", "def": "Device that transfers electrical power or wiring between the frame and door.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles": ["Detailing"]}, {"id": "t66", "term": "Est GM%", "def": "Estimated gross margin percentage established during Estimating.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles": ["Detailing", "Estimating"]}, {"id": "t21", "term": "Estimating", "def": "The Comsense workflow used to create and configure the information needed to develop and price a bid before the project is sold.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles": ["General Comsense User", "Estimating"]}, {"id": "t22", "term": "Estimator", "def": "A person who may perform Estimating workflow tasks, including developing estimates and providing information about estimating assumptions and pricing baselines.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles": ["General Comsense User", "Estimating"]}, {"id": "t39", "term": "ETR (Existing to Remain)", "def": "Indicates an existing project component that will remain in place rather than being replaced.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles": ["Detailing"]}, {"id": "t19", "term": "Factory Prep", "def": "Preparation performed by the manufacturer before the product is delivered.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles": ["Detailing"]}, {"id": "t10", "term": "Filter", "def": "Comsense function used to display only records that meet selected criteria.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles": ["General Comsense User"]}, {"id": "t32", "term": "Final Estimate", "def": "Final estimating information used as a baseline for the project before it transitions into Detailing.", "imageUrl": "", "linkLabel": "", "linkUrl": "", "roles var root=document.getElementById(id), termsEl=document.getElementById(id+"-terms"), searchEl=document.getElementById(id+"-search"), azEl=document.getElementById(id+"-az"), summaryEl=document.getElementById(id+"-summary");

function escapeHtml(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function highlight(text,q){return escapeHtml(text);}
function matchesRole(t){return activeRole && (t.roles.indexOf(activeRole)>-1 || t.roles.indexOf("General Comsense User")>-1);}
function formatMetadata(t,q){return '<div class="g-meta-row"><span class="g-meta-label">TASK/ COMSENSE WORKFLOW:</span>'+t.roles.map(function(r){return '<span class="g-type-tag g-type-tag-general">'+escapeHtml(r)+'</span>';}).join('')+'</div>';}
function renderTerm(t,q){
  var html="";
  if(style==="accordion"){
    var isOpen=expanded[t.id];
    html+='<div class="g-term" id="'+id+'-term-'+t.id+'">';

    html+='<svg class="g-term-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 9-7 7-7-7"/></svg>';
    html+='</button>';
    html+='<div class="g-term-content'+(isOpen?" open":"")+'">';
    if(t.imageUrl)html+='<div class="g-img-wrap"><img class="g-img" src="'+t.imageUrl+'" alt="'+escapeHtml(t.term)+'"></div>';

}


function render(){
 var q=searchEl.value.trim().toLowerCase();
 var filtered=terms.filter(function(t){return matchesRole(t)&&(!activeLetter||t.term[0].toUpperCase()===activeLetter)&&(!q||(t.term+' '+t.def).toLowerCase().indexOf(q)>-1);}).sort(function(a,b){return a.term.localeCompare(b.term);});

 document.getElementById(id+'-role-note').textContent=activeRole?(activeRole==='AP Specialist'?'Showing shared General Comsense terms. AP-specific terms have not been added yet.':activeRole==='General Comsense User'?'Showing shared General Comsense terms.':'Includes shared General Comsense terms.') : '';
 [searchEl,document.getElementById(id+'-expand'),document.getElementById(id+'-collapse'),document.getElementById(id+'-pdf')].forEach(function(e){e.disabled=!activeRole;});

 if(!activeRole){termsEl.innerHTML='<div class="g-empty">Choose your role above to view the glossary.</div>';return;}

 var groups={};filtered.forEach(function(t){var l=t.term[0].toUpperCase();(groups[l]||(groups[l]=[])).push(t);});

}
root.addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 if(b.dataset.role){activeRole=b.dataset.role;activeLetter='';searchEl.value='';expanded={};expandedLetters={};render();}
 else if(b.classList.contains('g-az-btn')){activeLetter=activeLetter===b.dataset.letter?'':b.dataset.letter;render();}

 else if(b.id===id+'-clear'){activeLetter='';searchEl.value='';render();}
 else if(b.id===id+'-expand'){terms.forEach(function(t){expanded[t.id]=true;expandedLetters[t.term[0].toUpperCase()]=true;});render();}
 else if(b.id===id+'-collapse'){expanded={};expandedLetters={};render();}

});
